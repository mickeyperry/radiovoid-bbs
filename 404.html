<p>[ R A D I O V O I D ] · reconnecting…</p>
<script>
// Share links for tracks uploaded after the last deploy don't have a static
// page yet — recover the id from /s/<id>/ and jump straight to the player.
var m = location.pathname.match(/\/s\/([A-Za-z0-9-]+)\/?/);
location.replace('/radiovoid-bbs/' + (m ? '?play=' + m[1] : ''));
</script>

name: Supabase keepalive
on:
  schedule:
    - cron: '17 */2 * * *'   # every 2h — Supabase pauses free projects with too little traffic
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read tracks + messages
        env:
          BASE: https://uhcxcnhsujsawgzfaeae.supabase.co
          KEY: sb_publishable_oRCO4ISFS51ebU3-rpyxew_U_ktpJSs
        run: |
          fail=0
          for t in tracks messages; do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              "$BASE/rest/v1/$t?select=id&limit=1" -H "apikey: $KEY")
            echo "$t -> HTTP $code"
            [ "$code" = "200" ] || fail=1
          done
          exit $fail
